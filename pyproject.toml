[project]
name = "usage-pulse"
version = "0.1.3"
description = "Local passive usage telemetry for Claude Code, Codex, and Kimi Code sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "0langas" }]
keywords = ["claude-code", "codex", "kimi-code", "mcp", "telemetry", "sqlite"]
dependencies = [
  "mcp>=1.13.0",
  "pydantic>=2.11.0",
  "tiktoken>=0.11.0",
]

[project.scripts]
usage-pulse-hook = "usage_pulse.hooks:main"
usage-pulse-mcp = "usage_pulse.mcp_server:main"

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=usage_pulse --cov-report=term-missing --cov-fail-under=80"
